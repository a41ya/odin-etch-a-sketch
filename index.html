<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etch-A-Sketch</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>

  <link rel="icon" href="./images/icon.png" type="image/png" sizes="32x32">
</head>

<body>
  <div id="center">
    <h1 id="title">etch-a-sketch</h1>

    <!-- grid -->
    <div id="divContainer"></div>

    <!-- buttons -->
    <div id="buttons">
      <button id="gridBtn" class="button">grid size</button>
      <button id="colorBtn" class="button">color</button>
    </div>

    <!-- pop-ups -->
     <div id="popUps">
      <dialog id="gridPopUp">
        <div id="gridPopUpDiv">
          <p id="gridTitle">enter a grid size between 1 and 100</p>
          <input type="number" min="1" max="100" id="inputGrid">
          <button id="submitGrid">submit</button>
          <button id="closeBtnGrid">close window</button>
        </div>
      </dialog>

      <dialog id="colorPopUp">
        <div id="colorPopUpDiv">
          <p id="colorTitle">color picker</p>
          <div id="colorButtons">
            <button id="blackColor" class="color">black</button>
            <button id="pinkColor" class="color">pink</button>
            <button id="rainbow" class="color">rainbow</button>
          </div>
          
          <button id="closeBtnColor">close window</button>
        </div>
      </dialog>
    </div>
  </div>  
</body>
</html>
