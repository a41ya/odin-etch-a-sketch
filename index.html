<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etch-A-Sketch</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <div id="center">
    <h1 id="title">etch-a-sketch</h1>

    <!-- grid -->
    <div id="divContainer"></div>

    <!-- buttons -->
    <div id="buttons">
      <button id="gridBtn" class="button">grid size</button>
      <button id="colorBtn" class="button">color</button>
    </div>

    <!-- pop-ups -->
    <dialog id="gridPopUp">
      <p>grid pop up</p>
      <button id="closeBtnGrid">x</button>
    </dialog>

    <dialog id="colorPopUp">
      <p>color picker</p>
      <button id="closeBtnColor">x</button>
    </dialog>
  </div>  
</body>
</html>
